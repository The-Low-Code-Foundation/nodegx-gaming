<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Worm Plate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a bench. The plate (canvas) on the left, the brain on the right, the instrument strip under both. */
:root {
  --bg: #eef0ee; --paper: #f8f9f7; --fg: #1d2420; --muted: #5d6862; --line: #cfd6d1;
  --agar: #e9e2bf; --agar-rim: #cbc38f; --accent: #0f766e;
  --food: #d98c1a; --harm: #c0392b; --patch: #8e44ad; --fire: #ff8c00; --neuron: #9aa39c;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --paper: #161c19; --fg: #e6ebe8; --muted: #93a09a; --line: #2b3531;
  --agar: #22281f; --agar-rim: #3a4230; --accent: #4fd1c5; --food: #f0a63a; --harm: #ef6a5c; --patch: #b57be0; --fire: #ffb14a; --neuron: #3b463f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1412; --paper: #161c19; --fg: #e6ebe8; --muted: #93a09a; --line: #2b3531;
  --agar: #22281f; --agar-rim: #3a4230; --accent: #4fd1c5; --food: #f0a63a; --harm: #ef6a5c; --patch: #b57be0; --fire: #ffb14a; --neuron: #3b463f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 10px }
h1 { font-family: var(--display); font-weight: 700; font-size: 38px; letter-spacing: .01em; margin: 0; line-height: 1 }
header p { margin: 0; color: var(--muted); max-width: 62ch }
nav.levels { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 12px }
nav.levels button { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); border-radius: 4px; cursor: pointer }
nav.levels button[aria-selected="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent) }
nav.levels button:focus-visible, .ctl button:focus-visible, .ctl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
nav.levels small { display: block; font-family: var(--body); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; opacity: .8 }
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 820px) { .bench { grid-template-columns: 1fr } }
.plate { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0 }
.plate canvas { width: 100%; height: auto; display: block; border-radius: 4px; touch-action: manipulation }
.brain { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0 }
.brain h2, .notes h2 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: .02em }
.brain svg { width: 100%; height: auto; display: block }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(9px, 1fr)); gap: 2px; margin: 2px 0 }
.cg { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; align-items: start; margin: 3px 0 }
.cg > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 1px; line-height: 1.2 }
.cells i.new { background: var(--harm) }
.lenses { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 6px }
.lens { border-top: 2px solid var(--line); padding-top: 6px } .lens h3 { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: .02em } .lens h3 small { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0 } .lens p { font-size: 14.5px; margin: 0 }
.stance { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 14px } .stance span { color: var(--muted) } .stance label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
.lines { border-collapse: collapse; width: 100%; font-size: 13.5px } .lines th, .lines td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top } .lines th { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .02em } .lines tr:first-child th { border-top: 0; color: var(--muted); font-size: 13px }
.notes { max-width: 70ch } .notes .lenses, .notes .stance { max-width: none }
.cells i { display: block; aspect-ratio: 1; background: var(--neuron); border-radius: 1px; opacity: .55 }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px }
.ctl button { font: 600 14px var(--body); padding: 7px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; cursor: pointer }
.ctl button.on { background: var(--accent); color: var(--bg); border-color: var(--accent) }
.ctl button.harm { border-color: var(--harm); color: var(--harm) } .ctl button.harm.on { background: var(--harm); color: #fff }
.ctl button.patch { border-color: var(--patch); color: var(--patch) } .ctl button.patch.on { background: var(--patch); color: #fff }
.ctl label { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center }
.read { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 10px }
.read div { border-top: 2px solid var(--line); padding-top: 4px }
.read b { display: block; font-family: var(--mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1 }
.read span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.notes { margin-top: 16px }
.notes p { margin: 0 0 10px }
.k { font-family: var(--mono); font-size: 13.5px; background: var(--paper); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--line) }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 6px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 5px }
.chart { margin-top: 8px } .chart svg { width: 100%; height: auto; display: block }
.lineages { font-family: var(--mono); font-size: 12.5px; margin-top: 6px; display: grid; gap: 2px }
.lineages div { display: flex; gap: 8px; align-items: center; min-width: 0 } .lineages i { width: 10px; height: 10px; border-radius: 50%; flex: none }
.lineages div { cursor: pointer; padding: 2px 4px; border-radius: 3px } .lineages div.picked { background: var(--bg); outline: 1px solid var(--line) } .lineages span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mut { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 8px; max-height: 150px; overflow: auto; border-top: 1px solid var(--line); padding-top: 6px }
.mut b { color: var(--fg); font-weight: 600 }
.view { display: none } .view.on { display: block }
.hint { font-size: 13px; color: var(--muted) }
.names { font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--fg); margin: 4px 0 8px; min-height: 3em }
.names b { font-family: var(--body); font-weight: 600; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
</head><body>
<div class="wrap">
<header>
  <h1>The Worm Plate</h1>
  <p>A worm lives on an agar plate. Its brain is the panel on the right. Four brains, from two cells to the real 302, then one that evolves, then the argument.</p>
</header>
<nav class="levels" role="tablist">
  <button role="tab" data-level="1" aria-selected="true">1 · Two cells<small>Braitenberg vehicle</small></button>
  <button role="tab" data-level="2" aria-selected="false">2 · Touch circuit<small>8 real cell classes</small></button>
  <button role="tab" data-level="3" aria-selected="false">3 · The full 302<small>C. elegans connectome</small></button>
  <button role="tab" data-level="4" aria-selected="false">4 · Evolution plate<small>mutation, death, colour</small></button>
  <button role="tab" data-level="5" aria-selected="false">5 · The debate<small>four lenses, your line</small></button>
</nav>
<div class="bench">
  <div class="plate"><canvas id="plate" width="640" height="640" aria-label="the plate"></canvas>
    <div class="ctl" id="plateCtl"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="brain" id="brain"></div>
</div>
<div class="notes" id="notes"></div>
</div>

<!-- Plain scripts, loaded in order (no modules, no build): edit a file in src/ and refresh. -->
<script src="src/engine.js"></script>
<script src="src/gloss.js"></script>
<script src="src/connectome.js"></script>
<script src="src/app.js"></script>
</body></html>
