<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Château Tient</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the 3D view fills the window. The UI floats over it: a top bar, a camera cluster bottom-right, and a sheet that is a side panel (dressing) or a bottom sheet (planning, results). */
:root {
  --bg: #1c2230; --fg: #fff7e8; --muted: #c9c2b4; --panel: rgba(22, 26, 36, .88); --panel2: rgba(255,255,255,.08); --line: rgba(255,255,255,.14);
  --accent: #ffb703; --accent-ink: #2b2100; --p1: #4cc9f0; --p2: #f072b6; --good: #7ad37a; --bad: #ff6b6b;
  --display: "Fredoka", "Nunito", system-ui, sans-serif; --body: "Nunito", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; overflow: hidden; touch-action: none; user-select: none; }
/* a canvas is a replaced element: inset alone does not size it, so on a Retina screen it showed its 2x drawing buffer at
   2x and only the top-left quarter of the picture was on screen (every camera complaint from v1 to v5) */
#gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
#top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px; display: flex; align-items: center; gap: 10px; pointer-events: none; flex-wrap: wrap; }
#top > * { pointer-events: auto; }
#top .brand { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
#top .stage { font-family: var(--display); font-weight: 600; background: var(--panel); padding: 6px 12px; border-radius: 10px; }
#top .score { display: flex; gap: 6px; background: var(--panel); padding: 6px 10px; border-radius: 10px; font-weight: 800; }
#top .score b { padding: 0 6px; border-radius: 6px; }
#top .spacer { flex: 1; }
button.small { font: 700 13px var(--body); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
#cam { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 56px); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; z-index: 3; pointer-events: none; }
#cam > * { pointer-events: auto; }
#cam button { font: 700 13px var(--body); height: 34px; padding: 0 10px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; white-space: nowrap; }
#cam button[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,183,3,.28); }
#cam .who, #cam .zoom { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border-radius: 10px; padding: 0 4px; height: 34px; }
#cam .who b { font: 800 13px var(--body); padding: 0 4px; white-space: nowrap; }
#cam .who button, #cam .zoom button { width: 30px; height: 28px; padding: 0; border: 0; background: rgba(255,255,255,.1); }
#cam.hide { display: none; }
/* the live boards during the wave: one miniature per defender, plus the castle's */
#strip { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; overflow-x: auto; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px); background: var(--panel); backdrop-filter: blur(8px); z-index: 2; max-height: 42vh; }
#strip[hidden] { display: none; }
.mini { flex: none; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 6px; }
.mini .mt { font: 800 12px var(--body); margin: 0 0 3px; white-space: nowrap; }
.mini .mb { position: relative; }
.mini svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mini svg path { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2; }
.mini svg path.lit { stroke: var(--accent); stroke-width: 3.5; }
.mn { position: absolute; width: 84px; background: #2b2a33; border: 1px solid #49485a; border-radius: 6px; font: 700 10.5px var(--body); line-height: 14px; overflow: hidden; transition: box-shadow .05s; }
.mn .mh { padding: 1px 4px; height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mn.sensor .mh { background: rgb(34,49,70); } .mn.cond .mh { background: rgb(65,52,33); } .mn.action .mh { background: rgb(30,57,47); }
.mn .mr { padding: 0 4px; height: 14px; color: var(--muted); text-align: right; }
.mn .mr.in { text-align: left; }
.mn.lit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(255,183,3,.7); }
.mn .mr.lit-oui { background: rgba(122,211,122,.35); color: #fff; } .mn .mr.lit-non { background: rgba(255,107,107,.3); color: #fff; }
.mn.blocked { border-color: var(--bad); }
.mn .why { position: absolute; right: 2px; bottom: 1px; font-size: 9.5px; color: var(--bad); }
.tip { font-size: 11px; color: var(--accent); padding: 2px 8px 4px; line-height: 1.25; }
.models { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.models b { font: 700 13px var(--display); color: var(--muted); }
.models button { font: 700 12.5px var(--body); border: 1px dashed var(--accent); background: rgba(255,183,3,.1); color: var(--fg); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
.models button.locked { opacity: .45; border-style: dotted; }
.conseil { background: rgba(255,183,3,.12); border-left: 4px solid var(--accent); border-radius: 8px; padding: 7px 10px; margin: 6px 0; font-weight: 700; font-size: 14.5px; }
.conseil b { color: var(--accent); font-family: var(--display); }
.blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; margin: 6px 0; }
.blocks button { text-align: left; font: 700 14px var(--body); background: var(--panel2); color: var(--fg); border: 2px solid transparent; border-radius: 10px; padding: 7px 9px; cursor: pointer; }
.blocks button small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.blocks button.locked { opacity: .5; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 50vh; overflow: auto; background: var(--panel); backdrop-filter: blur(10px); border-radius: 18px 18px 0 0; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); box-shadow: 0 -8px 30px rgba(0,0,0,.4); z-index: 2; }
#sheet.hide { display: none; }
#sheet.side { left: auto; top: calc(env(safe-area-inset-top, 0px) + 56px); bottom: 0; width: min(440px, 100vw); max-height: none; border-radius: 18px 0 0 0; }
@media (max-width: 760px) { #sheet.side { left: 0; top: auto; width: auto; max-height: 56vh; border-radius: 18px 18px 0 0; } }
#sheet h2 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 0 8px; }
#sheet h3 { font-family: var(--display); font-weight: 600; font-size: 15px; margin: 10px 0 5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#sheet p { margin: 0 0 10px; color: var(--muted); font-size: 15px; max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 4px 0; }
button.btn { font: 700 16px var(--display); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 11px 18px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
button.btn:active { transform: translateY(2px); box-shadow: none; }
button.btn.ghost { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
button:focus-visible, .port:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip { font: 700 13.5px var(--body); background: var(--panel2); color: var(--fg); border: 2px solid transparent; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,183,3,.15); }
.chip.locked { opacity: .55; }
.chip .sw { display: inline-block; width: 18px; height: 18px; border-radius: 5px; vertical-align: -4px; border: 1px solid rgba(0,0,0,.3); }
input[type="text"] { font: 700 16px var(--body); padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--fg); width: 10em; }
.wave { display: flex; gap: 8px; flex-wrap: wrap; }
.wave .en { display: flex; align-items: center; gap: 6px; background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-weight: 800; }
.wave .en i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
.tabs { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
.tabs button { font: 700 14px var(--body); background: var(--panel2); color: var(--fg); border: 2px solid transparent; border-radius: 10px; padding: 7px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { border-color: var(--accent); }
.board { position: relative; height: 230px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 18px 18px; }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.board svg path { fill: none; stroke-width: 3; pointer-events: stroke; cursor: pointer; stroke: var(--p1); }
.node { position: absolute; width: 150px; background: #2b2a33; border: 1px solid #49485a; border-radius: 8px; font-size: 12.5px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.node .head { padding: 5px 8px; font-weight: 800; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
.node.sensor .head { background: rgb(34,49,70); } .node.cond .head { background: rgb(65,52,33); } .node.action .head { background: rgb(30,57,47); }
.node .head button { background: none; border: 0; color: rgba(255,255,255,.7); font-size: 14px; cursor: pointer; padding: 0 2px; }
.node .ports { padding: 4px 0; }
.node .pr { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px; font-weight: 700; }
.port { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #1a1a24; background: var(--p1); cursor: pointer; flex: none; }
.port.in { margin-left: -14px; } .port.out { margin-right: -14px; }
.port.pending { background: var(--accent); box-shadow: 0 0 0 4px rgba(255,183,3,.35); }
.node select { font: 700 12px var(--body); background: rgba(0,0,0,.35); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; max-width: 92px; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.palette button { font: 700 13px var(--body); border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; color: #fff; }
.palette button.cond { background: rgb(85,68,43); } .palette button.action { background: rgb(40,77,62); } .palette button.locked { opacity: .5; }
.palette .arms { font-weight: 800; color: var(--accent); margin-left: 4px; }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
#banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 700; font-size: clamp(32px, 7vw, 64px); color: var(--accent); text-shadow: 0 4px 0 rgba(0,0,0,.5), 0 0 30px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; padding: 0 16px; z-index: 4; }
#banner.show { opacity: 1; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-weight: 800; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 4; }
#toast.show { opacity: 1; }
.big { font-family: var(--display); font-size: 26px; font-weight: 700; }
.ok { color: var(--good); } .ko { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { #banner, #toast { transition: none; } }
/* v7: the places to defend, the copy row, the pad that walks a villager */
.spots { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.spots button { font: 700 13px var(--body); background: var(--panel2); color: var(--fg); border: 2px solid transparent; border-radius: 10px; padding: 6px 9px; cursor: pointer; }
.spots button.free { border: 2px dashed rgba(255,183,3,.55); }
.spots button[aria-pressed="true"] { border-color: var(--accent); border-style: solid; background: rgba(255,183,3,.15); }
.copy { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.copy b { font: 700 13px var(--display); color: var(--muted); }
.copy button { font: 700 12.5px var(--body); border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
#cam .pad { display: inline-flex; align-items: center; gap: 3px; background: var(--panel); border-radius: 10px; padding: 0 4px; height: 34px; }
#cam .pad button { width: 34px; height: 28px; padding: 0; border: 0; background: rgba(255,255,255,.1); touch-action: none; }
.pop { font-weight: 800; color: var(--fg) !important; }
</style>

<canvas id="gl"></canvas>
<div id="top">
  <span class="brand" id="brand">Le Château Tient</span>
  <span class="stage" id="stageLbl"></span>
  <span class="score" id="scoreLbl"></span>
  <span class="spacer"></span>
  <button type="button" class="small" id="dressBtn" hidden>👕</button>
  <button type="button" class="small" id="langBtn">EN</button>
</div>
<div id="cam" class="hide"></div>
<div id="strip" hidden></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="sheet"></div>
