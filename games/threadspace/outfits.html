<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ThreadSpace — what the crew wear</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0c0e; color: #cfd3d8; font: 13px ui-monospace, Menlo, monospace; overflow: hidden; }
      #bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
      #bar button { background: #1a1d21; color: #cfd3d8; border: 1px solid #2c3036; padding: 6px 10px; cursor: pointer; font: inherit; }
      #bar button.on { background: #e8a33a; color: #111; border-color: #e8a33a; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three-addons/" } }
    </script>
  </head>
  <body>
    <div id="bar"></div>
    <script type="module">
      // The carrier's crew in each outfit (src/carrier/crew.mjs OUTFITS): the six people side by side, one department
      // each, under light like a lit room aboard. Drag to turn them. ?outfit=duty|uniform|vac|own, ?pose=idle|walk|…
      // window.__outfits.show(outfit, pose) for scripted screenshots; .zoom(i) frames one person's head and shoulders.
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { crewMember, OUTFITS } from './src/carrier/crew.mjs';

      const q = new URLSearchParams(location.search);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.append(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1d22);
      scene.add(new THREE.HemisphereLight(0xdfe6ef, 0x3a3630, 1.3));
      const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
      key.position.set(3, 5, 6);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9fb8d8, 1.2);
      rim.position.set(-4, 3, -5);
      scene.add(rim);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshPhongMaterial({ color: 0x2a2d31 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);
      const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
      camera.position.set(0, 1.5, 9.5);
      const orbit = new OrbitControls(camera, renderer.domElement);
      orbit.target.set(0, 1.0, 0);
      orbit.update();
      addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });

      const DEPTS = ['command', 'flight', 'engineering', 'crew', 'command', 'engineering'];
      let people = [], token = 0;
      async function show(outfit = 'duty', pose = 'idle') {
        const my = ++token;
        const ms = await Promise.all(DEPTS.map((d, i) => crewMember(i, d, { outfit })));
        if (my !== token) return;
        for (const m of people) m.root.removeFromParent();
        people = ms;
        ms.forEach((m, i) => {
          m.root.position.set((i - 2.5) * 1.1, 0, 0);
          m.root.rotation.y = Math.PI; // facing the camera
          scene.add(m.root);
          m.play(pose, 0);
        });
        for (const b of bar.children) b.classList.toggle('on', b.dataset.k === outfit || b.dataset.p === pose);
        state.outfit = outfit, state.pose = pose;
      }
      function zoom(i, turn = 0) {
        const m = people[i];
        if (!m) return;
        const p = m.root.position;
        orbit.target.set(p.x, 1.35, p.z);
        camera.position.set(p.x + Math.sin(turn) * 1.3, 1.5, p.z + Math.cos(turn) * 1.3);
        orbit.update();
      }
      function wide() {
        orbit.target.set(0, 1.0, 0);
        camera.position.set(0, 1.5, 9.5);
        orbit.update();
      }
      const state = { outfit: q.get('outfit') ?? 'duty', pose: q.get('pose') ?? 'idle' };
      const bar = document.getElementById('bar');
      for (const k of Object.keys(OUTFITS)) {
        const b = document.createElement('button');
        b.textContent = k;
        b.dataset.k = k;
        b.onclick = () => show(k, state.pose);
        bar.append(b);
      }
      for (const p of ['idle', 'walk', 'talk', 'workTable', 'lookAround']) {
        const b = document.createElement('button');
        b.textContent = p;
        b.dataset.p = p;
        b.onclick = () => show(state.outfit, p);
        bar.append(b);
      }
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = Math.min(0.05, clock.getDelta());
        for (const m of people) m.update(dt);
        renderer.render(scene, camera);
      });
      window.__outfits = { show, zoom, wide, people: () => people, camera, orbit };
      show(state.outfit, state.pose);
    </script>
  </body>
</html>
